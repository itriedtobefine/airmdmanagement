version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: mdm_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mdm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mdm_secret}
      POSTGRES_DB: ${POSTGRES_DB:-mdm_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mdm_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mdm_network

  redis:
    image: redis:7-alpine
    container_name: mdm_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mdm_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mdm_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mdm_admin}:${POSTGRES_PASSWORD:-mdm_secret}@postgres:5432/${POSTGRES_DB:-mdm_db}
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CORS_ORIGINS: ["http://localhost", "http://localhost:80", "http://localhost:3000"]
      APP_NAME: MDM System
      APP_VERSION: 1.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - mdm_network
    command: >
      sh -c "python -c \"from infrastructure.database import engine, Base; from sqlalchemy import text; import asyncio; asyncio.run(engine.connect())\" && uvicorn main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mdm_frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - mdm_network

  nginx:
    image: nginx:alpine
    container_name: mdm_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - mdm_network

volumes:
  postgres_data:

networks:
  mdm_network:
    driver: bridge
