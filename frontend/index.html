<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .todo-form {
            padding: 30px;
            border-bottom: 1px solid #eaeaea;
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .form-input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .form-input::placeholder {
            color: #aaa;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .filters {
            display: flex;
            gap: 10px;
            padding: 20px 30px;
            border-bottom: 1px solid #eaeaea;
            background: #f8f9fa;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            border-color: #667eea;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .todo-list {
            list-style: none;
            padding: 0;
        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 20px 30px;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.3s;
        }

        .todo-item:hover {
            background: #f8f9fa;
        }

        .todo-item:last-child {
            border-bottom: none;
        }

        .todo-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #ddd;
            border-radius: 50%;
            margin-right: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .todo-checkbox:hover {
            border-color: #667eea;
        }

        .todo-checkbox.checked {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
        }

        .todo-checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .todo-content {
            flex: 1;
            min-width: 0;
        }

        .todo-title {
            font-size: 1.05rem;
            color: #333;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .todo-title.completed {
            text-decoration: line-through;
            color: #aaa;
        }

        .todo-description {
            font-size: 0.9rem;
            color: #666;
            word-break: break-word;
        }

        .todo-meta {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 8px;
        }

        .todo-date {
            font-size: 0.8rem;
            color: #999;
        }

        .todo-actions {
            display: flex;
            gap: 8px;
            margin-left: 15px;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            font-size: 1.1rem;
        }

        .btn-edit {
            background: #e3f2fd;
            color: #1976d2;
        }

        .btn-edit:hover {
            background: #1976d2;
            color: white;
        }

        .btn-delete {
            background: #ffebee;
            color: #d32f2f;
        }

        .btn-delete:hover {
            background: #d32f2f;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 30px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px 30px;
            margin: 20px 30px;
            border-radius: 8px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            background: #f8f9fa;
            border-top: 1px solid #eaeaea;
            font-size: 0.9rem;
            color: #666;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            .form-group {
                flex-direction: column;
            }

            .filters {
                flex-wrap: wrap;
                justify-content: center;
            }

            .todo-item {
                flex-wrap: wrap;
                padding: 15px 20px;
            }

            .todo-actions {
                width: 100%;
                justify-content: flex-end;
                margin-top: 10px;
                margin-left: 39px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 TODO App</h1>
            <p>Stay organized and productive</p>
        </div>

        <form class="todo-form" id="todoForm">
            <div class="form-group">
                <input 
                    type="text" 
                    class="form-input" 
                    id="todoTitle" 
                    placeholder="What needs to be done?" 
                    required
                    maxlength="255"
                >
                <button type="submit" class="btn btn-primary" id="addBtn">Add</button>
            </div>
            <div class="form-group">
                <input 
                    type="text" 
                    class="form-input" 
                    id="todoDescription" 
                    placeholder="Description (optional)"
                    maxlength="1000"
                >
            </div>
        </form>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <ul class="todo-list" id="todoList">
            <li class="loading">Loading todos...</li>
        </ul>

        <div class="stats" id="stats" style="display: none;">
            <span id="totalTasks">0 tasks</span>
            <span id="completedTasks">0 completed</span>
        </div>
    </div>

    <script>
        // API Configuration
        const API_BASE_URL = 'http://localhost:8000';

        // State
        let todos = [];
        let currentFilter = 'all';
        let editingId = null;

        // DOM Elements
        const todoForm = document.getElementById('todoForm');
        const todoTitleInput = document.getElementById('todoTitle');
        const todoDescriptionInput = document.getElementById('todoDescription');
        const todoList = document.getElementById('todoList');
        const errorMessage = document.getElementById('errorMessage');
        const statsDiv = document.getElementById('stats');
        const totalTasksSpan = document.getElementById('totalTasks');
        const completedTasksSpan = document.getElementById('completedTasks');
        const filterButtons = document.querySelectorAll('.filter-btn');

        // Utility Functions
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }

        function hideError() {
            errorMessage.style.display = 'none';
        }

        // API Functions
        async function fetchTodos(filter = null) {
            try {
                let url = `${API_BASE_URL}/todos?limit=100`;
                if (filter !== null && filter !== 'all') {
                    url += `&completed=${filter === 'completed'}`;
                }
                
                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to fetch todos');
                
                todos = await response.json();
                renderTodos();
                updateStats();
            } catch (error) {
                console.error('Error fetching todos:', error);
                showError('Failed to load todos. Make sure the backend is running.');
                todoList.innerHTML = '<li class="empty-state"><div class="empty-state-icon">⚠️</div><p>Error loading todos</p></li>';
            }
        }

        async function createTodo(title, description) {
            try {
                const response = await fetch(`${API_BASE_URL}/todos`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ title, description }),
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to create todo');
                }

                await fetchTodos(currentFilter);
                return true;
            } catch (error) {
                console.error('Error creating todo:', error);
                showError(error.message);
                return false;
            }
        }

        async function updateTodo(id, updates) {
            try {
                const response = await fetch(`${API_BASE_URL}/todos/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(updates),
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to update todo');
                }

                await fetchTodos(currentFilter);
                return true;
            } catch (error) {
                console.error('Error updating todo:', error);
                showError(error.message);
                return false;
            }
        }

        async function toggleTodo(id) {
            try {
                const response = await fetch(`${API_BASE_URL}/todos/${id}/toggle`, {
                    method: 'PATCH',
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to toggle todo');
                }

                await fetchTodos(currentFilter);
            } catch (error) {
                console.error('Error toggling todo:', error);
                showError(error.message);
            }
        }

        async function deleteTodo(id) {
            if (!confirm('Are you sure you want to delete this task?')) return;

            try {
                const response = await fetch(`${API_BASE_URL}/todos/${id}`, {
                    method: 'DELETE',
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to delete todo');
                }

                await fetchTodos(currentFilter);
            } catch (error) {
                console.error('Error deleting todo:', error);
                showError(error.message);
            }
        }

        // Render Functions
        function renderTodos() {
            hideError();

            if (todos.length === 0) {
                todoList.innerHTML = `
                    <li class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <p>No tasks yet. Add one above!</p>
                    </li>
                `;
                statsDiv.style.display = 'none';
                return;
            }

            statsDiv.style.display = 'flex';

            todoList.innerHTML = todos.map(todo => `
                <li class="todo-item" data-id="${todo.id}">
                    <div 
                        class="todo-checkbox ${todo.completed ? 'checked' : ''}" 
                        onclick="handleToggle(${todo.id})"
                    ></div>
                    <div class="todo-content">
                        <div class="todo-title ${todo.completed ? 'completed' : ''}">
                            ${escapeHtml(todo.title)}
                        </div>
                        ${todo.description ? `<div class="todo-description">${escapeHtml(todo.description)}</div>` : ''}
                        <div class="todo-meta">
                            <span class="todo-date">Created: ${formatDate(todo.created_at)}</span>
                        </div>
                    </div>
                    <div class="todo-actions">
                        <button class="btn-icon btn-edit" onclick="handleEdit(${todo.id})" title="Edit">✏️</button>
                        <button class="btn-icon btn-delete" onclick="handleDelete(${todo.id})" title="Delete">🗑️</button>
                    </div>
                </li>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateStats() {
            const total = todos.length;
            const completed = todos.filter(t => t.completed).length;
            
            totalTasksSpan.textContent = `${total} ${total === 1 ? 'task' : 'tasks'}`;
            completedTasksSpan.textContent = `${completed} completed`;
        }

        // Event Handlers
        function handleToggle(id) {
            toggleTodo(id);
        }

        function handleDelete(id) {
            deleteTodo(id);
        }

        function handleEdit(id) {
            const todo = todos.find(t => t.id === id);
            if (!todo) return;

            if (editingId === id) {
                // Save changes
                const newTitle = prompt('Edit title:', todo.title);
                if (newTitle === null) return;
                if (!newTitle.trim()) {
                    showError('Title cannot be empty');
                    return;
                }

                const newDescription = prompt('Edit description:', todo.description || '');
                if (newDescription === null) return;

                updateTodo(id, {
                    title: newTitle.trim(),
                    description: newDescription.trim() || null
                });
                editingId = null;
            } else {
                editingId = id;
            }
        }

        // Form Submit Handler
        todoForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = todoTitleInput.value.trim();
            const description = todoDescriptionInput.value.trim();

            if (!title) {
                showError('Please enter a task title');
                return;
            }

            const addBtn = document.getElementById('addBtn');
            addBtn.disabled = true;
            addBtn.textContent = 'Adding...';

            const success = await createTodo(title, description || null);

            if (success) {
                todoTitleInput.value = '';
                todoDescriptionInput.value = '';
                todoTitleInput.focus();
            }

            addBtn.disabled = false;
            addBtn.textContent = 'Add';
        });

        // Filter Buttons Handler
        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                filterButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                fetchTodos(currentFilter === 'all' ? null : currentFilter);
            });
        });

        // Initialize
        fetchTodos();
    </script>
</body>
</html>
